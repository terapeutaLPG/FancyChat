# =====================================================
#  FancyChat - konfiguracja pluginu
# =====================================================

# Format czatu: [prefix] Nick: wiadomosc
# W prefixach i kolorach uzywaj kodow & (np. &c, &l, &r).

# Czy wiadomosc powitalna i inne komunikaty maja byc pokazywane? (na razie zarezerwowane)
debug: false

# Lista rang - kolejnosc ma znaczenie (pierwsza pasujaca ranga wygrywa).
ranks:
  Admin:
    prefix: "&c[ADMIN] "
    name-color: "&c"
    message-color: "&f"
  Mod:
    prefix: "&9[MOD] "
    name-color: "&9"
    message-color: "&f"
  VIP:
    prefix: "&e[VIP] "
    name-color: "&e"
    message-color: "&f"
  Budowniczy:
    prefix: "&2⛏ &a[BUDOWNICZY] &r"
    name-color: ""
    message-color: "&f"
    # Gradient nicku w kolorach hex (#RRGGBB): zielony -> niebieski -> fioletowy.
    # Wymaga MC 1.16+. Jezeli gradient-start i gradient-end sa ustawione,
    # zamiast name-color uzywany jest gradient.
    gradient-start: "#3AFF5C"
    gradient-mid: "#3AA0FF"
    gradient-end: "#A64DFF"
  Gracz:
    prefix: "&7[GRACZ] "
    name-color: "&7"
    message-color: "&f"

# Ranga domyslna nadawana graczom bez zadnego uprawnienia fancychat.rank.<nazwa>.
# Musi pasowac do jednej z rang powyzej (wielkosc liter ma znaczenie).
# Uprawnienie wpisz malymi literami, np. fancychat.rank.budowniczy dla rangi Budowniczy.
default-rank: Gracz

# Mapowanie grup LuckPerms na rangi FancyChat.
# Graczowi w danej grupie LP (jej primary group) zostanie nadana podana ranga czatu.
# Przyklad ponizej: kazdy, kogo glowna grupa w LuckPerms to tylko_wand,
# bedzie mial na czacie range Budowniczy. Dodaj wlasne linie wg potrzeb.
lp-ranks:
  tylko_wand: Budowniczy

# Komunikaty pluginu (mozesz uzywac kodow &).
messages:
  no-permission: "&cNie masz uprawnien do tej komendy!"
  config-reloaded: "&aKonfiguracja FancyChat zostala przeladowana!"
  adminchat-enabled: "&aTryb admin chatu wlaczony - wszystko co napiszesz pojdzie do adminow."
  adminchat-disabled: "&cTryb admin chatu wylaczony."
